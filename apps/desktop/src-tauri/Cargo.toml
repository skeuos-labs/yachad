[package]
name = "yachad"
version = "0.1.0"
description = "Yachad - Presentation Synchronization Engine & Local Agent"
edition = "2021"

[lib]
name = "yachad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
sysinfo = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
